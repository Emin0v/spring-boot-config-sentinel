name: Bug report
description: Report reproducible incorrect behavior
title: ""
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve spring-boot-config-sentinel.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest configuration or sample project that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Affected version or commit
      placeholder: For example, 0.1.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Java and Spring Boot versions
      placeholder: For example, Java 21 and Spring Boot 3.5.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste relevant logs or stack traces. Remove secrets before submitting.
      render: shell
